<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/brand/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/brand/logo-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="%BRAND_THEME_COLOR_DARK%"
      media="(prefers-color-scheme: dark)"
    />
    <title>Menu</title>
    <script>
      try {
        const saved = localStorage.getItem('theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
